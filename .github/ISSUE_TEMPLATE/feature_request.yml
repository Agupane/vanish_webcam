name: Feature request
description: Suggest a new effect, gesture, platform or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The problem or idea, from the user's point of view.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work. For effects, describe the gesture and the visual; remember that VanishCam never draws text on the video and can't ship copyrighted anime audio or frames.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself (see CONTRIBUTING.md).
