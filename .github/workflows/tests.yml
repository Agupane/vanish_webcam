name: tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock.txt

      - name: Unit tests
        run: python -m unittest discover -v -p "test_*.py"

      - name: Self-test (downloads and verifies the models, loads every mode)
        run: |
          python -c "import vanish_cam; vanish_cam.download_models('normal')"
          python vanish_cam.py --self-test

      - name: Installer scripts syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh && bash -n install-ubuntu.sh && bash -n uninstall-ubuntu.sh && bash -n vanishcam.sh && bash -n BUILD_MACOS.sh

      - name: Installer script syntax (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
