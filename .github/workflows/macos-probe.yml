name: macos arm64 mediapipe probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        mediapipe: ["1.0.1", "1.1.0", "1.2.0", "0.10.14"]
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Switch MediaPipe
        run: |
          if [ "${{ matrix.mediapipe }}" = "0.10.14" ]; then
            python -m pip install --force-reinstall "numpy>=1.26,<2" "opencv-contrib-python==4.10.0.84" "mediapipe==0.10.14"
          else
            python -m pip install --force-reinstall "mediapipe==${{ matrix.mediapipe }}"
          fi
          python -c "import mediapipe; print('mediapipe', mediapipe.__version__)"

      - name: Self-test
        run: |
          python -c "import vanish_cam; vanish_cam.download_models('normal')"
          python vanish_cam.py --self-test
